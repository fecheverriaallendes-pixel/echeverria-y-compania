<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background Circle / Badge -->
  <circle cx="250" cy="250" r="235" fill="#fff5f7" stroke="url(#roseGold)" stroke-width="8" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Botanical / Decorative Crown -->
  <path d="M 250 85 C 240 115 220 130 200 135 C 225 140 240 160 250 180 C 260 160 275 140 300 135 C 280 130 260 115 250 85 Z" fill="url(#roseGold)" />
  <circle cx="250" cy="80" r="6" fill="#f59e0b" />
  <circle cx="195" cy="135" r="4" fill="#f43f5e" />
  <circle cx="305" cy="135" r="4" fill="#f43f5e" />

  <!-- Monogram Crest (E) -->
  <g transform="translate(250, 215)">
    <!-- Stylized Monogram Shield -->
    <path d="M -60 -45 C -40 -60 40 -60 60 -45 C 75 10 50 65 0 90 C -50 65 -75 10 -60 -45 Z" fill="none" stroke="url(#roseGold)" stroke-width="4" />
    
    <!-- Sophisticated Letter E with Beauty Flourish -->
    <path d="M -22 -32 L 24 -32 C 28 -32 30 -30 28 -26 C 26 -22 22 -22 18 -22 L -10 -22 L -10 -4 L 14 -4 C 18 -4 20 -2 19 2 C 18 6 14 6 10 6 L -10 6 L -10 24 L 24 24 C 28 24 30 26 28 30 C 26 34 22 34 18 34 L -26 34 C -30 34 -32 32 -32 28 L -32 -26 C -32 -30 -30 -32 -26 -32 Z" fill="#9d174d" />
    <path d="M 0 -12 C 12 -24 28 -18 24 -4 C 20 8 4 18 0 28" fill="none" stroke="url(#goldShine)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Sparkles -->
  <path d="M 130 180 Q 140 180 140 170 Q 140 180 150 180 Q 140 180 140 190 Q 140 180 130 180 Z" fill="#f59e0b" />
  <path d="M 355 195 Q 365 195 365 185 Q 365 195 375 195 Q 365 195 365 205 Q 365 195 355 195 Z" fill="#f59e0b" />

  <!-- Ribbon / Divider -->
  <line x1="100" y1="330" x2="400" y2="330" stroke="url(#roseGold)" stroke-width="3" />
  <polygon points="250,323 257,330 250,337 243,330" fill="#f59e0b" />

  <!-- Typography: ECHEVERRIA -->
  <text x="250" y="375" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', 'Times New Roman', serif" font-size="34" font-weight="900" fill="#831843" letter-spacing="4">
    ECHEVERRIA
  </text>

  <!-- Typography: COSMETICS -->
  <text x="250" y="415" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#db2777" letter-spacing="9">
    COSMETICS
  </text>

  <!-- Subtitle -->
  <text x="250" y="445" text-anchor="middle" font-family="'Montserrat', Arial, sans-serif" font-size="10" font-weight="700" fill="#9f1239" letter-spacing="4">
    BEAUTY • SKINCARE • MAKEUP
  </text>
</svg>
