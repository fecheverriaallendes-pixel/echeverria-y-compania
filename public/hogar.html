<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ECHEVERRÍA HOME – Catálogo Oficial de Alfombras &amp; Hogar</title>
    <meta name="description" content="Catálogo oficial de alfombras de sala, shaggy, pasillos, bajadas de cama, felpudos y textiles para el hogar de Echeverría Home • Echeverria &amp; Cía. Consulta stock y precios en tiempo real.">
    
    <!-- OpenGraph Tags para WhatsApp, Telegram, Facebook, Instagram, iMessage -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ECHEVERRÍA HOME &amp; DECO">
    <meta property="og:title" content="ECHEVERRÍA HOME – Catálogo Oficial de Alfombras">
    <meta property="og:description" content="Descubre nuestra exclusiva colección de alfombras de área, shaggy pelo largo, pasillos, bajadas de cama y textiles para el hogar con stock y precios en tiempo real.">
    <meta property="og:image" content="/echeverria_home_logo.svg">
    <meta property="og:image:secure_url" content="/echeverria_home_logo.svg">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:image:alt" content="Logo Oficial Echeverría Home &amp; Deco">
    
    <!-- Twitter / X Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ECHEVERRÍA HOME – Catálogo Oficial de Alfombras">
    <meta name="twitter:description" content="Catálogo oficial de alfombras y textiles de hogar • Echeverria &amp; Cía.">
    <meta name="twitter:image" content="/echeverria_home_logo.svg">
    <link rel="image_src" href="/echeverria_home_logo.svg">

    <!-- Favicon e Iconos -->
    <link rel="icon" type="image/svg+xml" href="/echeverria_home_logo.svg">
    <link rel="apple-touch-icon" href="/echeverria_home_logo.svg">
    <meta name="theme-color" content="#7c2d12">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "ECHEVERRÍA HOME & DECO",
      "description": "Catálogo oficial de alfombras, textiles y decoración con stock en tiempo real.",
      "image": "/echeverria_home_logo.svg",
      "parentOrganization": {
        "@type": "Organization",
        "name": "Echeverria & Compañía"
      }
    }
    </script>

    <!-- Redirección automática instantánea al catálogo de hogar -->
    <meta http-equiv="refresh" content="0; url=/#/catalogo-publico/hogar">
    <script>
      (function() {
        var base = window.location.origin + window.location.pathname.replace(/\/(hogar|alfombras)(\.html)?$/, '');
        var target = base + '/#/catalogo-publico/hogar';
        if (window.location.search) {
          target += (target.indexOf('?') >= 0 ? '&' : '?') + window.location.search.replace(/^\?/, '');
        }
        window.location.replace(target);
      })();
    </script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #431407 0%, #7c2d12 50%, #9a3412 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: rgba(255, 255, 255, 0.98);
        color: #1f2937;
        padding: 36px 28px;
        border-radius: 24px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      }
      .logo-img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(124, 45, 18, 0.2);
        margin: 0 auto 16px auto;
        display: block;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        color: #7c2d12;
      }
      .company-subtitle {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #b45309;
        font-weight: 800;
        margin-bottom: 12px;
      }
      p {
        margin: 0 0 24px 0;
        font-size: 13px;
        color: #4b5563;
        line-height: 1.5;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 14px 20px;
        background: linear-gradient(135deg, #c2410c 0%, #ea580c 100%);
        color: white;
        text-decoration: none;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-radius: 14px;
        box-shadow: 0 10px 20px rgba(194, 65, 12, 0.3);
        box-sizing: border-box;
        transition: transform 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .spinner {
        margin-top: 16px;
        font-size: 11px;
        color: #9ca3af;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: #ea580c;
        border-radius: 50%;
        animation: pulse 1.2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
</head>
<body>
    <div class="card">
        <img src="/echeverria_home_logo.svg" alt="Echeverría Home Logo" class="logo-img">
        <div class="company-subtitle">Echeverria &amp; Compañía</div>
        <h1>ECHEVERRÍA HOME</h1>
        <p>Catálogo oficial de alfombras de sala, shaggy, pasillos, bajadas de cama y textiles para el hogar con stock y precios en tiempo real.</p>
        <a href="/#/catalogo-publico/hogar" class="btn">Entrar al Catálogo</a>
        <div class="spinner">
            <span class="dot"></span>
            <span>Cargando catálogo oficial de alfombras...</span>
        </div>
    </div>
</body>
</html>
