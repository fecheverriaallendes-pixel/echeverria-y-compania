<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="EL MUNDO TECH – Catálogo Oficial de Tecnología">

    <meta property="og:image" content="/mundo_tech_logo.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="Logo Oficial El Mundo Tech">
    
    <!-- Twitter / X Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="EL MUNDO TECH – Catálogo Oficial de Tecnología">
    <meta name="twitter:description" content="Explora nuestro catálogo oficial de tecnología y periféricos • Echeverria & Cía.">
    <meta name="twitter:image" content="/mundo_tech_logo.png">
    <link rel="image_src" href="/mundo_tech_logo.png">

    <!-- Favicon e Iconos -->
    <link rel="icon" type="image/png" href="/mundo_tech_logo.png">
    <link rel="apple-touch-icon" href="/mundo_tech_logo.png">
    <meta name="theme-color" content="#0284c7">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "EL MUNDO TECH",
      "description": "Catálogo oficial de tecnología, gadgets y novedades con stock en tiempo real.",
      "image": "/mundo_tech_logo.png",
      "parentOrganization": {
        "@type": "Organization",
        "name": "Echeverria & Compañía"
      }
    }
    </script>

    <!-- Redirección automática instantánea al catálogo -->
    <meta http-equiv="refresh" content="0; url=/#/catalogo-publico/tecnologia">
    <script>
      (function() {
        var base = window.location.origin + window.location.pathname.replace(/\/tecnologia(\.html)?$/, '');
        var target = base + '/#/catalogo-publico/tecnologia';
        if (window.location.search) {
          target += (target.indexOf('?') >= 0 ? '&' : '?') + window.location.search.replace(/^\?/, '');
        }
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #0369a1 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: rgba(255, 255, 255, 0.98);
        color: #0f172a;
        padding: 36px 28px;
        border-radius: 24px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      }
      .logo-img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(2, 132, 199, 0.2);
        margin: 0 auto 16px auto;
        display: block;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: #0284c7;
      }
      p {
        margin: 0 0 20px 0;
        font-size: 13px;
        color: #64748b;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(to right, #0284c7, #0369a1);
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo-img" src="/mundo_tech_logo.png" alt="El Mundo Tech">
        <h1>EL MUNDO TECH</h1>
        <p>Cargando el catálogo de tecnología oficial...</p>
        <a class="btn" href="/#/catalogo-publico/tecnologia">Abrir Catálogo</a>
    </div>
</body>
</html>
